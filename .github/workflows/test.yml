name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: API (server)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      # npm ci exige que el lockfile este sincronizado con package.json.
      - name: Instalar dependencias
        run: npm ci

      - name: Correr los tests
        run: npm test

      - name: Verificar que el lockfile no este desactualizado
        run: npm ci --dry-run
